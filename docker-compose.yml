services:
  chat-service:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8899:8899"
    env_file:
      - .env
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  huggingface_cache:
